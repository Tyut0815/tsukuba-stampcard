<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子スタンプラリー</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf1dc; --card:#fffaf0; --ink:#1b2a4a; --ink2:#46526e;
  --red:#b32a17; --hanko:#d63a21; --mustard:#f0b429; --line:#e3d3b0; --ok:#1f6b4a;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(rgba(27,42,74,.06) 1px,transparent 1.3px);background-size:16px 16px;
  line-height:1.6;font-size:16px;-webkit-tap-highlight-color:transparent;line-break:strict;overflow-wrap:anywhere}
body.modal-open{overflow:hidden}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:520px;margin:0 auto;padding:10px 14px 36px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px #fff}
h1:focus,h2:focus{outline:none;box-shadow:none}

.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 4px 0 var(--ink)}
.card h2{font-size:1.15rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}

/* header */
.head{padding-top:0;overflow:hidden;text-align:center}
.bunting{display:block;width:calc(100% + 32px);margin:0 -16px 6px;height:30px}
.head h1{font-size:clamp(1.15rem,5.4vw,1.45rem);font-weight:800;line-height:1.35;text-wrap:balance}
.head .sub{color:var(--ink2);font-size:.95rem;margin-top:4px;text-wrap:balance}
.prog{margin-top:14px}
.count{font-size:2.2rem;font-weight:800;line-height:1.1;color:var(--red);font-variant-numeric:tabular-nums}
.count span{font-size:.9rem;color:var(--ink2);font-weight:700;margin-left:6px}
.bar{height:16px;background:#eadfc4;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--hanko);transition:width .5s ease}

.warn-banner{margin:10px 0 0;padding:10px 12px;background:#fff1c9;border:2px solid #b07a00;border-radius:12px;font-size:.9rem;font-weight:700}

/* stamp slots */
.slots{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px}
.slot{width:calc((100% - 20px)/3);text-align:center;position:relative}
@media (min-width:440px){.slot{width:calc((100% - 40px)/5)}}
.circle{position:relative;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center}
.slot.empty .circle{border:3px dashed #a8997a;color:#6f654f;font-size:1.8rem;font-weight:800;background:rgba(255,255,255,.5)}
.slot.filled .circle{background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.cap{font-size:.75rem;color:var(--ink2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp-wrap{display:block;width:100%;height:100%;transform:rotate(var(--rot,0deg));mix-blend-mode:multiply}
.stamp-wrap svg{display:block;width:100%;height:100%}
.hanko{color:var(--hanko)}
.hanko text{font-family:var(--font);font-weight:800;text-anchor:middle}
.stamp-wrap.pop{animation:stampIn .65s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes stampIn{
  0%{opacity:0;transform:rotate(var(--rot,0deg)) scale(2.4)}
  55%{opacity:1;transform:rotate(var(--rot,0deg)) scale(.9)}
  75%{transform:rotate(var(--rot,0deg)) scale(1.05)}
  100%{opacity:1;transform:rotate(var(--rot,0deg)) scale(1)}
}
.slot.thump .circle::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--hanko);animation:ripple .7s ease-out .3s both;pointer-events:none}
@keyframes ripple{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}

/* spots */
.spots{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.spot{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.spot.done{background:#fdf6ee;border-color:#e2b9a8}
.spot-head{display:flex;align-items:center;gap:10px}
.spot-head h3{font-size:1.05rem;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
.pill{flex:none;min-width:44px;text-align:center;padding:2px 10px;border-radius:99px;font-weight:800;font-size:.9rem;border:2px solid var(--ink)}
.pill.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.todo{background:#eadfc4;color:var(--ink)}
.place{margin-top:8px;font-weight:700;display:flex;gap:6px;align-items:flex-start}
.place svg{flex:none;margin-top:4px}
.hint{margin-top:4px;color:var(--ink2);font-size:.95rem;overflow-wrap:anywhere}
.when{margin-top:8px;font-size:.9rem;color:var(--ok);font-weight:700}
.spot .btn{margin-top:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 18px;border-radius:14px;border:2px solid var(--ink);
  font:inherit;font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;text-align:center;line-height:1.3;color:var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.accent{background:var(--mustard);color:var(--ink)}
.btn.secondary{background:var(--card)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.block{display:flex;width:100%}
.btn.disabled-look{background:#e6dfcc;color:#4d4a40;border-style:dashed;box-shadow:none;cursor:not-allowed}
.btn.small{min-height:44px;padding:6px 14px;font-size:.9rem}
.linkbtn{background:none;border:0;font:inherit;font-size:.85rem;color:var(--ink2);text-decoration:underline;min-height:44px;padding:0 10px;cursor:pointer}

/* how to */
.how summary{cursor:pointer;font-weight:800;font-size:1.1rem;min-height:44px;display:flex;align-items:center}
.how summary{list-style:none;justify-content:space-between;gap:8px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"タップで開く ▼";font-size:.85rem;font-weight:700;color:var(--ink2);white-space:nowrap}
.how[open] summary::after{content:"閉じる ▲"}
.how ol{margin:8px 0 0;padding-left:1.4rem}
.how li{margin:6px 0}
.how .note{font-size:.85rem;color:var(--ink2);margin-top:8px}

/* mission */
.mission.locked{background:#eee6d2;border-style:dashed;box-shadow:none}
.mission .lockmsg{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mission p{margin:6px 0}
.mission ol{padding-left:1.4rem;margin:8px 0}
.pidbox{background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:12px;margin:12px 0;text-align:center}
.pidbox .lbl{font-size:.85rem;color:var(--ink2);font-weight:700}
.pid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;font-weight:700;font-size:2.3rem;letter-spacing:.16em;line-height:1.3;margin:2px 0 6px;padding-left:.16em;user-select:all}
.copystat{min-height:1.6em;font-size:.9rem;font-weight:700;color:var(--ink2);margin-top:6px}
.stack{display:grid;gap:10px;margin-top:12px}
.done-note{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--ok)}

/* completion */
.complete{position:relative;overflow:hidden;background:var(--ink);color:#fff;border:3px solid var(--mustard);border-radius:20px;padding:22px 14px 18px;margin:14px 0 6px;text-align:center}
.complete>:not(.confetti){position:relative;z-index:1}
.complete h2{font-size:2.1rem;font-weight:800;color:var(--mustard);line-height:1.25;margin-bottom:8px}
.complete .panel{background:var(--card);color:var(--ink);border-radius:14px;padding:12px;margin:12px 0;text-align:left}
.complete .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.complete .row:last-child{border-bottom:0}
.complete .k{font-size:.85rem;color:var(--ink2);font-weight:700}
.complete .v{font-weight:800}
.complete .cpid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.7rem;letter-spacing:.14em}
.clockbox{text-align:center;padding-top:8px}
.clockdate{font-size:.85rem;color:var(--ink2);font-weight:700}
.clock{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.complete .show{font-size:1.15rem;font-weight:800}
.head h1,.head .sub,.dlg-title,.complete .show,.complete h2{text-wrap:balance}
.seg{display:inline-block}
.complete .btn{margin-top:12px}
.complete.given{background:#e6e0d2;color:#575650;border:3px dashed #a39b88}
.complete.given h2{color:#575650;font-size:1.35rem}
.complete.given .panel{background:#f3efe4;color:#575650}
.complete.given .k{color:#5f5d55}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:-24px;width:9px;height:15px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(560px) rotate(640deg);opacity:.35}}

footer{text-align:center;margin-top:18px;color:var(--ink2);font-size:.8rem}

/* modal */
.backdrop{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(27,42,74,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.dialog{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px;width:100%;max-width:400px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 6px 0 var(--ink);animation:dlgIn .22s ease-out}
.dialog:focus{outline:none}
.backdrop.kb{align-items:flex-start;padding:8px 12px}
.backdrop.kb .dialog{padding:14px;animation:none}
.backdrop.kb .form .desc{display:none}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.dlg-title{font-size:1.2rem;font-weight:800;line-height:1.4;margin-bottom:10px;text-align:center;text-wrap:balance}
.dlg-body p{margin:6px 0}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 120px}
.form .desc{font-size:.92rem;color:var(--ink2)}
.form .lbl{display:block;font-weight:800;margin:10px 0 4px}
.field{width:100%;min-height:50px;font:inherit;font-size:1.15rem;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.field:disabled{background:#eee;color:#555}
.msg{min-height:1.6em;margin-top:8px;font-size:.92rem;font-weight:700}
.msg.warn{color:var(--red)}
.shake{animation:shake .45s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.celebrate{text-align:center}
.bigstamp{width:170px;height:170px;margin:4px auto 8px}
.celebrate .lead{font-size:1.25rem;font-weight:800;color:var(--red)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .confetti{display:none}
}
</style>
</head>

/* 合言葉の正規化：空白除去 → NFKC → カタカナをひらがなに → 小文字 */

function genPid() {

    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint8Array(6);
      crypto.getRandomValues(a);
      let o = "";
      for (let i = 0; i < 6; i++) o += ALPHABET[a[i] % 32];

  for (let i = 0; i < 6; i++) o += ALPHABET[Math.floor(Math.random() * 32)];

/* ---------- 失敗回数の制限（60秒に5回まちがえたら30秒ロック） ---------- */

/* ---------- ハンコのSVG ---------- */

    const a = i / N * Math.PI * 2;
    const rad = 45 + (r() - 0.5) * 1.8 + Math.sin(a * 3 + idx) * 0.5;
    d += (i ? "L" : "M") + (50 + Math.cos(a) * rad).toFixed(2) + " " + (50 + Math.sin(a) * rad).toFixed(2);
  }
  d += "Z";

      svgEl("circle", { cx: 50, cy: 50, r: 39.5, fill: "none", stroke: "currentColor", "stroke-width": "1.3" }),
      svgEl("text", { x: 50, y: 40, "font-size": 24 }, String(idx + 1)),
      svgEl("text", { x: 50, y: 57, "font-size": fs }, chars.join("")),
      svgEl("rect", { x: 28, y: 63, width: 44, height: 1.4 }),

/* ---------- モーダル ---------- */
let currentModal = null;

/* スマホのキーボードが出たとき、見えている範囲にダイアログを収める */

/* ---------- スタンプ処理 ---------- */
function clearHash() {
  try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) { /* 無視 */ }
}

  state.stamps[spot.id] = Date.now();
  save();
  render();
  showCelebrate(spot);
}

  let h = "";
  try { h = location.hash || ""; } catch (e) { return; }
  if (h.length < 2) return;
  let tok = h.slice(1);
  try { tok = decodeURIComponent(tok); } catch (e) { /* そのまま */ }
  tok = tok.trim().toLowerCase();
  const spot = CONFIG.spots.find(s => s.token != null && String(s.token).trim() !== "" && tok === String(s.token).trim().toLowerCase());
  if (!spot) return;
  clearHash();
  acquire(spot);
}
function showCelebrate(spot) {
  const idx = CONFIG.spots.indexOf(spot);
  const n = stampedCount();
  const all = n === TOTAL;
  const stamp = stampNode(spot, idx, state.stamps[spot.id]);
  stamp.classList.add("pop");
  const content = el("div", { class: "celebrate" },
    el("div", { class: "bigstamp" }, stamp),
    el("p", { class: "lead", text: "これで " + n + " / " + TOTAL }),
    el("p", { text: all ? (state.submittedAt ? "全部そろいました！ 感想文も送信済みなので、コンプリートです！" : "全部そろいました！ 最終ミッション「感想文」に進もう。") : "あと" + (TOTAL - n) + "つ。がんばって！" }));
  openModal({
    title: spot.name + "のスタンプをゲット！", content,
    buttons: [{ label: all ? (state.submittedAt ? "コンプリート画面へ" : "最終ミッションへ") : "閉じる", kind: "primary" }],
    onClose: () => {
      const slot = Array.from(document.querySelectorAll("[data-slot]")).find(n => n.getAttribute("data-slot") === String(spot.id));
      if (slot) {
        slot.classList.add("thump");
        const w = slot.querySelector(".stamp-wrap");
        if (w) w.classList.add("pop");
      }
      if (all) {
        const f = state.submittedAt ? $(".complete") : $("#final");

      }
    }
  });
}

    content: el("p", { text: spot.name + "のスタンプは、" + fmtMD(ts) + " " + fmtHM(ts) + " に押してあります。次のスポットへ行こう！" }),
    buttons: [{ label: "閉じる", kind: "primary" }]

}

  svg.append(svgEl("path", { d: "M0 4 Q260 24 520 4", fill: "none", stroke: "#1b2a4a", "stroke-width": 2 }));
  for (let i = 0; i < 14; i++) {
    const x = i * 40 + 5, t = x / 520;
    const y = 4 + 40 * t * (1 - t); // 曲線に沿わせる
    svg.append(svgEl("polygon", { points: (x - 14) + "," + y.toFixed(1) + " " + (x + 14) + "," + y.toFixed(1) + " " + x + "," + (y + 15).toFixed(1),
      fill: colors[i % 4], stroke: "#1b2a4a", "stroke-width": 1.5, "stroke-linejoin": "round" }));
  }
  return svg;
}

/* 区切り文字ごとに改行しない塊（inline-block）にする */
function segs(text, sep, joiner) {
  const parts = String(text).split(sep).filter(Boolean);
  const out = [];
  parts.forEach((t, i) => { if (i) out.push(joiner); out.push(el("span", { class: "seg", text: t })); });
  return out;
}
/* BudouX で文節の途中で改行しないようにする（読み込めなくても動く） */
function phrase(root) {
  try { if (root && window.__budouxJa) window.__budouxJa.applyToElement(root); } catch (e) {}
}
function renderHeader() {
  const n = stampedCount();
  const pct = TOTAL ? Math.round(n / TOTAL * 100) : 0;
  return el("header", { class: "card head" },
    bunting(),
    el("h1", { id: "main-title", tabindex: "-1" }, segs(CONFIG.title, /\s+/, " ")),
    el("p", { class: "sub" }, segs(TOTAL + "つのスポットをまわって、|スタンプを集めよう！", "|", "")),
    el("div", { class: "prog" },
      el("div", { class: "count", "aria-label": "進み具合 " + TOTAL + "つ中" + n + "つ" }, n + " / " + TOTAL, el("span", { text: "あつまった" })),
      el("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(TOTAL), "aria-valuenow": String(n), "aria-label": "スタンプの進み具合" },
        el("i", { style: "width:" + pct + "%" }))));
}
function renderSlots() {
  const ul = el("ol", { class: "slots", "aria-label": "スタンプカード" });
  CONFIG.spots.forEach((sp, i) => {
    const ts = state.stamps[sp.id];
    const li = el("li", { class: "slot " + (ts ? "filled" : "empty"), "data-slot": sp.id,
      "aria-label": (i + 1) + "番 " + sp.name + (ts ? " スタンプ済み" : " まだ") },
      el("div", { class: "circle", "aria-hidden": "true" }, ts ? stampNode(sp, i, ts) : String(i + 1)),
      el("div", { class: "cap", "aria-hidden": "true", text: sp.name }));
    ul.append(li);
  });
  return el("section", { class: "card", "aria-labelledby": "card-h" }, el("h2", { id: "card-h", text: "スタンプカード" }), ul);
}
function renderSpots() {
  const ul = el("ul", { class: "spots" });
  CONFIG.spots.forEach((sp, i) => {
    const ts = state.stamps[sp.id];
    ul.append(el("li", { class: "spot" + (ts ? " done" : "") },
      el("div", { class: "spot-head" },
        el("span", { class: "num", "aria-hidden": "true", text: String(i + 1) }),
        el("h3", { text: sp.name }),
        el("span", { class: "pill " + (ts ? "done" : "todo") }, ts ? "済" : "未", el("span", { class: "sr", text: ts ? "（スタンプ済み）" : "（まだ）" }))),
      el("p", { class: "place" }, pinIcon(), el("span", { text: "場所：" + sp.place })),
      sp.hint ? el("p", { class: "hint", text: sp.hint }) : null,
      ts ? el("p", { class: "when", text: fmtMD(ts) + " " + fmtHM(ts) + " にスタンプをゲット" })
         : el("button", { type: "button", class: "btn secondary", "data-open-spot": sp.id, onclick: () => openWordModal(sp), text: "合言葉を入力" })));
  });
  return el("section", { class: "card", "aria-labelledby": "spots-h" }, el("h2", { id: "spots-h", text: "スポット一覧" }), ul);
}
function renderHow() {
  const d = el("details", { class: "card how" },
    el("summary", { text: "あそびかた" }),
    el("ol", null,
      el("li", { text: "各スポットのQRコードをスマホで読み取るか、掲示された「合言葉」を入力するとスタンプが押されます。" }),
      el("li", { text: TOTAL + "つ集めたら、最終ミッション「感想文」を書いて送ろう（1つ以上集めれば、先に書くこともできます）。" }),
      el("li", { text: "感想文を送ったら、受付で完了画面を見せてね。" })),
    el("p", { class: "note", text: "記録はこの端末のこのブラウザに残ります。同じスマホ・同じブラウザで使ってください。" }));
  d.open = howOpen;
  d.addEventListener("toggle", () => { howOpen = d.open; });
  return d;
}
function copyPid(statusEl) {
  const done = ok => { statusEl.textContent = ok ? "コピーしました" : "コピーできませんでした。手で入力してください"; };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(state.pid).then(() => done(true), () => done(false));
    } else done(false);
  } catch (e) { done(false); }
}
function confirmSubmit() {
  openModal({
    title: "本当に送信しましたか？",
    content: el("p", { text: "Googleフォームで感想文を送信したあとに「送信しました」を押してください。まだなら、先にフォームを送ってね。" }),
    buttons: [
      { label: "まだ送っていない", kind: "secondary" },
      { label: "送信しました", kind: "primary", onClick: h => {
          state.submittedAt = Date.now(); save();
          h.close({ restore: false });
          render();
          if (isComplete()) { window.scrollTo(0, 0); focusFallback(); }
          else { const f = $("#final"); if (f) { try { f.scrollIntoView({ block: "start" }); } catch (e) {} } }
          return false;
      } }
    ]
  });
}
function renderMission() {
  const unlocked = missionOpen();
  const cnt = stampedCount();
  const early = cnt < TOTAL;
  const sec = el("section", { class: "card mission" + (unlocked ? "" : " locked"), id: "final", "aria-labelledby": "final-h" });
  sec.append(el("h2", { id: "final-h", text: "最終ミッション：感想文" }));
  if (!unlocked) {
    sec.append(
      el("p", { class: "lockmsg" }, lockIcon(), el("span", { text: TOTAL + "つ集めると開きます" })),
      el("p", { text: "コース発表会の感想をGoogleフォームに書いて送るミッションです。あと" + (TOTAL - cnt) + "つ！" }));
    if (cnt >= 1) {
      sec.append(
        el("p", { text: "スタンプが全部そろう前に、先に感想文を書くこともできます（任意）。" }),
        el("button", { type: "button", class: "btn secondary block", text: "今すぐ感想文を書く", onclick: () => {
          state.earlyOpenAt = Date.now(); save(); render();
          const h = $("#final-h");
          if (h) { h.setAttribute("tabindex", "-1"); try { h.focus({ preventScroll: true }); h.scrollIntoView({ block: "start" }); } catch (e) {} }
        } }));
    } else {
      sec.append(el("p", { class: "copystat", text: "スタンプを1つ集めると、先に書くこともできます。" }));
    }
    return sec;
  }
  const pidbox = el("div", { class: "pidbox" },
    el("div", { class: "lbl", text: "あなたの参加番号" }),
    el("div", { class: "pid", text: state.pid }));
  if (state.submittedAt) {
    sec.append(pidbox, el("p", { class: "done-note", text: "感想文の送信を記録しました（" + fmtFull(state.submittedAt) + "）" }),
      el("p", { text: early ? "あとはスタンプを集めるだけ！ 残り" + (TOTAL - cnt) + "つそろうとコンプリートです。" : "上の「コンプリート！」画面を受付で見せてください。" }));
    return sec;
  }
  const stat = el("p", { class: "copystat", role: "status", "aria-live": "polite" });
  pidbox.append(el("button", { type: "button", class: "btn secondary small", text: "参加番号をコピー", onclick: () => copyPid(stat) }), stat);
  const url = String(CONFIG.formUrl || "").trim();
  const link = /^https?:\/\//i.test(url)
    ? el("a", { class: "btn accent block", href: url, target: "_blank", rel: "noopener", text: "感想文を書く（Googleフォーム）" })
    : el("div", { class: "btn disabled-look block", "aria-disabled": "true", text: "フォーム準備中です。係の人に聞いてください" });
  sec.append(
    el("p", { text: early ? "コース発表会の感想文を書いてください。スタンプはあとから集めても大丈夫です（コンプリートには" + TOTAL + "つ全部必要です）。" : "おめでとう！ 最後に、コース発表会の感想文を書いてください。" }),
    pidbox,
    el("p", { text: "フォームに参加番号を書いてください。" }),
    el("div", { class: "stack" },
      link,
      link.tagName === "A" ? el("p", { class: "copystat", text: "リンクは新しいタブで開きます。書き終わったらこの画面にもどってね。" }) : null,
      el("button", { type: "button", class: "btn primary block", text: "感想文を送信しました", onclick: confirmSubmit })));
  return sec;
}
function renderComplete() {
  const given = !!state.prizeAt;
  const sec = el("section", { class: "complete" + (given ? " given" : ""), "aria-labelledby": "complete-title" });
  if (!given) {
    const cols = ["#f0b429", "#d63a21", "#fffaf0", "#7fb4ff", "#ff9bb0"];
    const cf = el("div", { class: "confetti", "aria-hidden": "true" });
    for (let i = 0; i < 28; i++) {
      cf.append(el("span", { style: "left:" + ((i * 37) % 100) + "%;background:" + cols[i % cols.length] +
        ";animation-duration:" + (3 + (i % 5) * 0.6) + "s;animation-delay:-" + ((i % 7) * 0.7) + "s" }));
    }
    sec.append(cf);
  }
  sec.append(el("h2", { id: "complete-title", tabindex: "-1", text: given ? "景品お渡し済み（" + fmtHM(state.prizeAt) + "）" : "コンプリート！" }));
  sec.append(el("div", { class: "panel" },
    el("div", { class: "row" }, el("span", { class: "k", text: "参加番号" }), el("span", { class: "v cpid", text: state.pid })),
    el("div", { class: "row" }, el("span", { class: "k", text: "完了日時" }), el("span", { class: "v", text: fmtFull(completedAt()) })),
    el("div", { class: "clockbox" },
      el("div", { class: "clockdate", "data-clockdate": "1" }),
      el("div", { class: "clock", role: "timer", "data-clock": "1" }))));
  sec.append(el("p", { class: "show", text: given ? "景品はお渡し済みです" : "受付でこの画面を見せてください" }));
  if (!given) sec.append(el("button", { type: "button", class: "btn accent small", text: "係員用：景品お渡し済みにする", onclick: () => askPin("prize") }));
  return sec;
}
function tickClock() {
  const d = new Date();
  document.querySelectorAll("[data-clock]").forEach(n => { n.textContent = fmtHMS(d); });
  document.querySelectorAll("[data-clockdate]").forEach(n => { n.textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日"; });
}
function render() {
  const app = $("#app");
  app.textContent = "";
  document.title = CONFIG.title;
  if (!storageOk) {
    app.append(el("div", { class: "warn-banner", role: "alert", text: "この端末では記録を保存できません。画面を閉じるとスタンプが消えます（シークレットモードは使わないでください）" }));
  }
  if (isComplete()) app.append(renderComplete());
  app.append(renderHeader(), renderHow(), renderSlots(), renderSpots(), renderMission(),
    el("footer", null,
      el("button", { type: "button", class: "linkbtn", text: "係員用：記録をリセット", onclick: () => askPin("reset") }),
      el("p", { text: CONFIG.title })));
  phrase(app);
  tickClock();
}

/* ---------- 起動 ---------- */
render();
setInterval(tickClock, 1000);
window.addEventListener("hashchange", handleHash);
// 別タブ（QRを読み直して開いたタブ等）で記録が変わったら反映する
window.addEventListener("storage", e => {
  if (e.key !== CONFIG.storageKey || !storageOk) return;
  state = loadState();
  render();
});
handleHash();
</script>
</body>
</html>
